name: Validate public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin package
        run: python3 scripts/validate_package.py
      - name: Compile Python helpers
        run: python3 -m compileall -q plugins/act4k1007-reclaimer/skills/act4k1007-reclaimer/scripts tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit tracked public files
        run: python3 scripts/audit_public_tree.py
